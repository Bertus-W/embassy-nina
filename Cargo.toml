[package]
name          = "embassy-nina"
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.87"
license       = "MIT OR Apache-2.0"
description   = "Async embedded-hal / embassy driver for the u-blox NINA-W102 module running Arduino WiFiNINA firmware."
readme        = "README.md"
repository    = "https://github.com/Bertus-W/embassy-nina"
documentation = "https://docs.rs/embassy-nina"
homepage      = "https://github.com/Bertus-W/embassy-nina"
categories    = ["embedded", "no-std", "asynchronous", "network-programming"]
keywords      = ["embassy", "nina", "wifinina", "no_std", "embedded-hal-async"]
include       = [
    "src/**/*.rs",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
embedded-hal       = "1.0"
embedded-hal-async = "1.0"
embedded-io        = "0.7"
embedded-io-async  = "0.7"
embedded-nal-async = "0.9"
embassy-time       = "0.5"
embassy-futures    = "0.1"
embassy-sync       = "0.7"

defmt = { version = "1.1", optional = true }

[features]
default = []
defmt   = ["dep:defmt"]

[package.metadata.docs.rs]
all-features = true
targets      = ["thumbv6m-none-eabi"]
rustdoc-args = ["--cfg", "docsrs"]
